# Local Postgres for development. Matches DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kopa
      POSTGRES_PASSWORD: kopa
      POSTGRES_DB: kopa
    ports:
      - "5432:5432"
    volumes:
      - kopa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kopa-pg:
