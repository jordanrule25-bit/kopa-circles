<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No signal · Kopa Circles</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --muted:#66666b; --accent:#1a7a35; --surface:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#a1a1a6; --accent:#34c759; --surface:#1c1c1e; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",system-ui,sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; display:grid; gap:14px; justify-items:center; }
  h1 { font-size:2rem; margin:0; letter-spacing:-0.02em; }
  p { color:var(--muted); font-size:1.05rem; line-height:1.5; margin:0; }
  button { margin-top:8px; border:0; border-radius:999px; background:var(--accent); color:#fff; font:inherit; font-weight:500; padding:12px 22px; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10.5 10.5 4 20 4c0 9.5-6.5 16-16 16z" fill="var(--accent)"/><path d="M4.5 19.5L15 9" stroke="var(--bg)" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
  <h1>No signal right now</h1>
  <p>This page hasn’t been opened on this phone before, so it isn’t saved. Pages you’ve opened still work, and members you add are saved and sent when you’re back online.</p>
  <button onclick="history.length > 1 ? history.back() : location.reload()">Go back</button>
</main>
</body>
</html>
